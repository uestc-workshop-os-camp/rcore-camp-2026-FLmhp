name: Jobs

on: [push]

env:
  CARGO_TERM_COLOR: always
  rust_toolchain: nightly

jobs:
  grade:
    runs-on: ubuntu-latest
    outputs:
      points: ${{ steps.end.outputs.points}}
    container:
      image: alicesama/rcore-ci:2024a
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          qemu-system-riscv64 --version
          rustup target add riscv64gc-unknown-none-elf
          git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}
          git clone https://github.com/uestc-workshop-os-camp/rCore-Tutorial-Checker.git ci-user
          git -C ci-user checkout --detach 7d61ec55b58eed6ca7052917846c1b87af34563a
          git clone https://github.com/uestc-workshop-os-camp/rCore-Tutorial-Test.git ci-user/user
          git -C ci-user/user checkout --detach a0593662ad55d670ba8c27ce1763347cd0dd552f
          ID=`git rev-parse --abbrev-ref HEAD | grep -oP 'ch\K[0-9]'`
          cd ci-user
          if make test CHAPTER=$ID OFFLINE=1 > ../output.txt 2>&1; then
            cat ../output.txt
          else
            status=$?
            cat ../output.txt
            exit "$status"
          fi
      - name: end
        id: end
        run: |
          cat output.txt | grep "Test passed" | grep -oP "\d{1,}/\d{1,}" | xargs -i echo "points={}"
          cat output.txt | grep "Test passed" | grep -oP "\d{1,}/\d{1,}" | xargs -i echo "points={}" >> $GITHUB_OUTPUT
  deploy:
    if: github.ref_name != 'ch7' && github.repository != 'LearningOS/rCore-Tutorial-Code'
    name: Deploy to pages
    needs: grade
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - uses: actions/checkout@v3
        continue-on-error: true
        with:
          ref: 'gh-pages'
      - name: Save Log File
        uses: yfblock/multi-rank-log@main
        with:
          public-dir: classroom
          points: ${{ needs.grade.outputs.points }}
      - name: GitHub Pages
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: gh-pages
          build_dir: ./classroom
          keep_history: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
